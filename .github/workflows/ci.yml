name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- app.bundle.js
      - run: npm run test:coverage
      - run: python tools/package.py
      - run: python tools/smoke-release.py
      - run: npx --yes eslint@10.14.0 .
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - name: Validar lock com hashes do e-SAJ
        run: python -m pip install --dry-run --require-hashes -r requirements-esaj.hashes.lock

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install chromium
      - run: pip install -r requirements.txt
      - run: npm run test:ui
      - run: npm run test:accessibility
      - run: npm run test:integrated

  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: npm audit (não bloqueante)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: pip-audit (não bloqueante)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
